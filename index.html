<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz - Perfil Maker (Fab Lab Rec)</title>
    <!-- Carrega o Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Carrega as fontes (Baloo 2 para títulos, Sarabun para corpo) -->
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700&family=Sarabun:wght@400;600&display=swap"
        rel="stylesheet">
    <style>
        /* Define as novas fontes */
        body {
            font-family: 'Sarabun', sans-serif;
        }

        .font-title {
            font-family: 'Baloo 2', sans-serif;
        }

        /* Estilo customizado para o card */
        .quiz-card {
            background-color: #ffffff;
        }

        /* Classe utilitária para esconder elementos */
        /* ADICIONADO !important para garantir que sobreponha o 'flex' do Tailwind */
        .hidden-view {
            display: none !important;
        }

        /* Animação suave de entrada */
        .fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body class="bg-[#5f356d] flex items-center justify-center min-h-screen p-4">

    <!-- Container Principal do Quiz -->
    <div
        class="quiz-card w-full max-w-2xl p-8 md:p-12 rounded-2xl shadow-2xl transition-all duration-300 text-gray-900 relative -z-0 overflow-hidden">

        <!-- DECORAÇÃO DE FUNDO (Opcional, para dar um charme) -->
        <div
            class="absolute top-0 right-0 -mt-10 -mr-10 w-40 h-40 bg-[#ff3333] rounded-full opacity-10 pointer-events-none -z-9">
        </div>
        <div
            class="absolute bottom-0 left-0 -mb-10 -ml-10 w-40 h-40 bg-[#5f356d] rounded-full opacity-10 pointer-events-none">
        </div>

        <!-- 0. TELA DE BOAS-VINDAS (NOVA) -->
        <div id="start-view" class="fade-in text-center flex flex-col items-center justify-center min-h-[400px]">
            <!-- Logo Grande -->
            <img id="logo-start" src="./assets/logo.png"
                onerror="this.src='https://placehold.co/200x80/5f356d/ffffff?text=FAB+LAB+REC&font=roboto'"
                alt="Logo Fab Lab" class="mb-8 h-20 object-contain relative z-10">

            <h1 class="font-title text-4xl font-bold text-[#5f356d] mb-4">
                Olá, Maker!
            </h1>

            <p class="text-lg text-gray-600 mb-8 max-w-md">
                A inovação acontece quando diferentes habilidades se encontram. Você está pronto para descobrir qual é o
                seu papel na <strong>Experiência Escalada</strong>?
            </p>

            <button id="start-btn"
                class="w-full sm:w-auto bg-[#ff3333] hover:bg-red-600 text-white font-title text-xl font-bold py-4 px-10 rounded-xl shadow-lg transform transition hover:scale-105 duration-200">
                🚀 Começar Jornada
            </button>

            <p class="text-sm text-gray-400 mt-8">Tempo estimado: 3 minutos</p>
        </div>

        <!-- 1. VISÃO DO QUIZ -->
        <div id="quiz-view" class="hidden-view fade-in">
            <!-- Logo Pequeno (Cabeçalho) -->
            <div class="flex justify-center mb-6">
                <img src="./assets/logo.png"
                    onerror="this.src='https://placehold.co/150x50/5f356d/ffffff?text=FAB+LAB+REC'" alt="Logo Fab Lab"
                    class="h-16 md:h-20 object-contain relative z-10">
            </div>

            <!-- Imagem da Pergunta -->
            <img id="question-image" src="" alt="Ilustração"
                class="w-full h-48 object-cover rounded-xl mb-6 shadow-md hidden-view bg-gray-100">

            <!-- Contador de Perguntas -->
            <div class="text-xs font-bold text-[#ff3333] tracking-widest uppercase mb-2">
                Pergunta <span id="current-question-num">1</span> de <span id="total-questions-num">8</span>
            </div>

            <!-- Texto da Pergunta -->
            <h2 id="question-text" class="font-title text-2xl md:text-3xl font-bold text-gray-800 mb-8 leading-tight">
                Carregando...
            </h2>

            <!-- Botões de Resposta -->
            <div id="answer-buttons" class="space-y-3">
                <!-- Botões gerados via JS -->
            </div>

            <!-- Navegação -->
            <div class="flex justify-between mt-8 pt-6 border-t border-gray-100">
                <button id="prev-button"
                    class="text-gray-400 hover:text-gray-600 font-semibold py-2 px-4 rounded transition-colors flex items-center gap-2">
                    ← Voltar
                </button>
            </div>
        </div>

        <!-- 2. VISÃO DE RESULTADO -->
        <div id="result-view" class="hidden-view text-center fade-in py-8">
            <div class="mb-6 inline-block p-4 rounded-full bg-gray-50">
                <span class="text-6xl">✨</span>
            </div>

            <h2 class="text-gray-500 font-semibold tracking-wide uppercase text-sm mb-2">Seu Perfil Maker é</h2>

            <h1 class="font-title text-3xl md:text-4xl font-bold mb-4 text-[#5f356d]" id="result-title">
                <!-- Título do Resultado -->
            </h1>

            <div class="inline-block px-4 py-1 rounded-full bg-gray-100 mb-6">
                <p class="font-title text-lg font-semibold" id="result-focus">
                    <!-- Foco do Resultado -->
                </p>
            </div>

            <p class="text-lg text-gray-700 mb-10 leading-relaxed" id="result-description">
                <!-- Descrição do Resultado -->
            </p>

            <button id="restart-button"
                class="w-full bg-gray-800 hover:bg-gray-900 text-white font-bold py-4 px-6 rounded-xl transition-colors duration-200 font-title text-lg">
                Refazer o Quiz
            </button>
        </div>
    </div>

    <!-- Lógica do Quiz -->
    <script>
        // --- 1. Dados ---
        const questions = [
            {
                question: "O fio do seu carregador de celular quebrou bem na ponta. Qual sua primeira reação?",
                image: "./assets/q1.jpg",
                answers: [
                    { text: "Pesquiso 'por que fios de carregador quebram?' para evitar que aconteça de novo.", profile: "inspiracao" },
                    { text: "Penso: 'E se eu inventasse um carregador sem fio que usa energia solar?'", profile: "ideacao" },
                    { text: "Pego fita isolante, um pedaço de fio e tento fazer uma 'gambiarra' para funcionar só hoje.", profile: "prototipacao" },
                    { text: "Mando foto no grupo dos amigos/família perguntando quem tem um sobrando para me emprestar.", profile: "compartilhamento" }
                ]
            },
            {
                question: "Num trabalho em grupo, quem é você?",
                image: "./assets/q2.jpg",
                answers: [
                    { text: "O que faz as perguntas difíceis e garante que o grupo está respondendo ao tema certo.", profile: "inspiracao" },
                    { text: "O que tem a ideia 'diferentona' para a apresentação.", profile: "ideacao" },
                    { text: "O que abre o Canva ou Google Slides e começa a montar o layout e organizar o conteúdo.", profile: "prototipacao" },
                    { text: "O que divide as tarefas, cobra os prazos e se oferece para apresentar o trabalho.", profile: "compartilhamento" }
                ]
            },
            {
                question: "Você vê um problema crônico na sua rua (ex: lixo acumulado). O que você pensa?",
                image: "./assets/q3.jpg",
                answers: [
                    { text: "Fico observando. Em que horários acontece? Quem são as pessoas? Qual a raiz disso?", profile: "inspiracao" },
                    { text: "Imagino 10 soluções: um app de denúncia, um robô-gari, uma intervenção artística...", profile: "ideacao" },
                    { text: "Penso numa solução prática: 'E se a gente pintasse uma faixa ou colocasse um cesto maior?'", profile: "prototipacao" },
                    { text: "Vou falar com a associação de moradores. Precisamos nos organizar e cobrar uma solução.", profile: "compartilhamento" }
                ]
            },
            {
                question: "Qual destas frases mais te descreve?",
                image: "./assets/q4.jpg",
                answers: [
                    { text: "Eu preciso entender o 'porquê' das coisas antes de agir.", profile: "inspiracao" },
                    { text: "E se a gente fizesse de um jeito *totalmente* diferente?", profile: "ideacao" },
                    { text: "Feito é melhor que perfeito. Vamos testar logo.", profile: "prototipacao" },
                    { text: "Sozinho a gente vai rápido, mas junto a gente vai mais longe.", profile: "compartilhamento" }
                ]
            },
            {
                question: "Você precisa gravar um vídeo mas não tem tripé. O que você faz?",
                image: "./assets/q5.jpg",
                answers: [
                    { text: "Pesquiso tutoriais de 'suporte caseiro' antes de decidir o melhor.", profile: "inspiracao" },
                    { text: "Penso: 'Posso usar um copo? Ou prender com um pregador? Ou um barbante?'", profile: "ideacao" },
                    { text: "Pego dois copos, livros e fita adesiva e monto um suporte agora.", profile: "prototipacao" },
                    { text: "Peço para um amigo segurar o celular para mim.", profile: "compartilhamento" }
                ]
            },
            {
                // PERGUNTA ADAPTADA DE BRASÍLIA PARA O RECIFE
                question: "Sobre o Recife, o que mais chama sua atenção e te fascina?",
                image: "./assets/q6.jpg", // Lembre-se de trocar o arquivo da imagem para algo do Recife (ex: Pontes ou Galo da Madrugada)
                answers: [
                    { text: "A rica história, a herança de Maurício de Nassau e as lendas urbanas que formam a identidade da cidade.", profile: "inspiracao" },
                    { text: "A capacidade de inovar, como o movimento Manguebeat (misturando tradição e tecnologia) ou o ecossistema do Porto Digital.", profile: "ideacao" },
                    { text: "A arquitetura desafiadora e a engenharia das antigas pontes que conectam a cidade cortada por rios e mangues.", profile: "prototipacao" },
                    { text: "A energia absurda das pessoas no Carnaval, construindo juntas a maior festa de rua do mundo no Galo da Madrugada.", profile: "compartilhamento" }
                ]
            },
            {
                question: "O que mais te move a agir?",
                image: "./assets/q7.jpg",
                answers: [
                    { text: "Injustiça ou decisões tomadas sem entender o problema.", profile: "inspiracao" },
                    { text: "Rotina, tédio e fazer as coisas 'só porque sempre foi assim'.", profile: "ideacao" },
                    { text: "Ineficiência. Coisas quebradas que ninguém conserta.", profile: "prototipacao" },
                    { text: "Desorganização e falta de colaboração entre as pessoas.", profile: "compartilhamento" }
                ]
            },
            {
                question: "Sábado livre com R$ 50,00. Qual o rolê?",
                image: "./assets/q8.jpg",
                answers: [
                    { text: "Museu, livraria ou visitar um bairro histórico (como o Recife Antigo).", profile: "inspiracao" },
                    { text: "Loja de artesanato ou papelaria para iniciar um projeto criativo.", profile: "ideacao" },
                    { text: "Loja de ferramentas para comprar material e consertar algo em casa.", profile: "prototipacao" },
                    { text: "Juntar com os amigos para comer algo ou resenhar em casa.", profile: "compartilhamento" }
                ]
            },
            {
                // NOVA PERGUNTA 1: CHUVA E ALAGAMENTO
                question: "Caiu um toró, o Recife alagou e você não consegue atravessar a rua. Como você age?",
                image: "./assets/q9.jpg", 
                answers: [
                    { text: "Tento entender o sistema de drenagem daquela rua específica e a maré do rio para saber a raiz do problema.", profile: "inspiracao" },
                    { text: "Começo a imaginar ideias loucas, tipo calçadas permeáveis gigantes ou um sistema de captação de água pluvial nas casas.", profile: "ideacao" },
                    { text: "Pego uns tijolos, pedaços de madeira e improviso uma passarela no 'desenrolo' pra galera não molhar o pé.", profile: "prototipacao" },
                    { text: "Crio um grupo de WhatsApp com os vizinhos para mapear os piores pontos e cobrar a prefeitura coletivamente.", profile: "compartilhamento" }
                ]
            },
            {
                // NOVA PERGUNTA 2: TAPIOCA/CULTURA LOCAL
                question: "Você vai fazer um lanche para a galera e decide fazer tapioca. Qual sua abordagem?",
                image: "./assets/q10.jpg",
                answers: [
                    { text: "Pesquiso a origem das receitas mais tradicionais para entender o ponto perfeito da goma.", profile: "inspiracao" },
                    { text: "Invento um recheio agridoce totalmente inusitado (tipo charque com geleia de pimenta) que ninguém testou.", profile: "ideacao" },
                    { text: "Vou testando a temperatura da frigideira na prática e jogando a massa até acertar a crocância exata no erro e acerto.", profile: "prototipacao" },
                    { text: "Transformo a cozinha numa linha de montagem e coloco cada amigo responsável por ralar queijo ou cuidar de um recheio.", profile: "compartilhamento" }
                ]
            },
            {
                // NOVA PERGUNTA 3: MÓVEL DESMONTADO
                question: "Você comprou um móvel que veio desmontado e o manual é super confuso.",
                image: "./assets/q11.jpg",
                answers: [
                    { text: "Vou direto pro YouTube procurar um tutorial de alguém montando o mesmo modelo e entendo a lógica primeiro.", profile: "inspiracao" },
                    { text: "Ignoro o manual e começo a imaginar se dá para montar as peças de um jeito diferente, criando um móvel novo.", profile: "ideacao" },
                    { text: "Pego a chave de fenda e vou testando o encaixe das peças na prática. Se der errado, eu desmonto e refaço.", profile: "prototipacao" },
                    { text: "Chamo alguém de casa, coloco uma música e transformo a montagem numa atividade em dupla.", profile: "compartilhamento" }
                ]
            },
            {
                // NOVA PERGUNTA 4: MARATONA DE IDEIAS (HACKATHON)
                question: "Você está participando de uma maratona de criação (tipo no Porto Digital). Qual o seu papel natural na equipe?",
                image: "./assets/q12.jpg",
                answers: [
                    { text: "Aquele que vai para a rua entrevistar potenciais usuários para garantir que o grupo está resolvendo um problema real.", profile: "inspiracao" },
                    { text: "A máquina de fazer brainstorm, colando post-its com ideias 'fora da caixinha' por todo lado.", profile: "ideacao" },
                    { text: "Aquele que abre o computador ou os materiais e já começa a programar ou construir a 'cara' do projeto para testar.", profile: "prototipacao" },
                    { text: "Aquele que organiza quem faz o quê, prepara a apresentação e anima a equipe quando bate o cansaço.", profile: "compartilhamento" }
                ]
            }
        ];

        const resultsData = {
            inspiracao: {
                title: "O Explorador Empático",
                focus: "Foco em Sentir e Observar",
                description: "Você é a base do projeto! Seu superpoder é a curiosidade e a escuta ativa. Você adora investigar os 'porquês', entender as pessoas e definir o problema real antes de agir.",
                colorClass: "text-[#5f356d]"
            },
            ideacao: {
                title: "O Visionário Criativo",
                focus: "Foco em Imaginar e Criar",
                description: "Você é a chama da inovação! Seu superpoder é imaginar futuros desejáveis. Você pensa fora da caixa, gera múltiplas alternativas e não tem medo de ideias radicais.",
                colorClass: "text-[#f28020]"
            },
            prototipacao: {
                title: "O Construtor Mão na Massa",
                focus: "Foco em Construir e Prototipar",
                description: "Você é o motor da realização! Seu superpoder é transformar ideias em ação. Você adora 'aprender fazendo', testar materiais e usar ferramentas para tornar o futuro palpável. Mestre do desenrolo!",
                colorClass: "text-[#90851c]"
            },
            compartilhamento: {
                title: "O Conector Colaborativo",
                focus: "Foco em Compartilhar e Mobilizar",
                description: "Você é a voz do time! Seu superpoder é a empatia e o protagonismo. Você une o grupo, garante que todos sejam ouvidos e sabe como comunicar uma ideia para engajar todo mundo.",
                colorClass: "text-[#ff3333]"
            }
        };

        // --- 2. Elementos DOM ---
        const startView = document.getElementById('start-view');
        const quizView = document.getElementById('quiz-view');
        const resultView = document.getElementById('result-view');

        const questionText = document.getElementById('question-text');
        const answerButtons = document.getElementById('answer-buttons');
        const questionImage = document.getElementById('question-image');
        const prevButton = document.getElementById('prev-button');
        const currentQNum = document.getElementById('current-question-num');
        const totalQNum = document.getElementById('total-questions-num');

        // --- 3. Estado ---
        let currentQuestionIndex = 0;
        let scores = { inspiracao: 0, ideacao: 0, prototipacao: 0, compartilhamento: 0 };
        let answerHistory = [];

        // --- 4. Funções ---

        function showScreen(screenId) {
            // Esconde todas
            [startView, quizView, resultView].forEach(el => el.classList.add('hidden-view'));
            // Mostra a desejada
            document.getElementById(screenId).classList.remove('hidden-view');
        }

        function startQuiz() {
            currentQuestionIndex = 0;
            scores = { inspiracao: 0, ideacao: 0, prototipacao: 0, compartilhamento: 0 };
            answerHistory = [];
            showScreen('quiz-view');
            showQuestion();
        }

        function showQuestion() {
            // Atualiza contadores
            currentQNum.innerText = currentQuestionIndex + 1;
            totalQNum.innerText = questions.length;

            // Limpa botões
            answerButtons.innerHTML = '';

            const q = questions[currentQuestionIndex];
            questionText.innerText = q.question;

            // Imagem (usa onerror no HTML para fallback se o arquivo local não existir)
            if (q.image) {
                questionImage.src = q.image;
                questionImage.classList.remove('hidden-view');
                // Adiciona fallback genérico caso a imagem local não carregue
                questionImage.onerror = function () {
                    this.src = `https://placehold.co/600x300/eeeeee/999999?text=Imagem+da+Pergunta+${currentQuestionIndex + 1}`;
                };
            } else {
                questionImage.classList.add('hidden-view');
            }

            // Gera botões
            q.answers.forEach(ans => {
                const btn = document.createElement('button');
                btn.innerText = ans.text;
                btn.className = 'w-full text-left bg-gray-50 hover:bg-[#ff3333] hover:text-white text-gray-700 font-medium py-4 px-6 rounded-xl transition-all duration-200 border border-gray-200 hover:border-[#ff3333] shadow-sm hover:shadow-md';
                btn.onclick = () => selectAnswer(ans.profile);
                answerButtons.appendChild(btn);
            });

            // Botão Voltar
            prevButton.style.opacity = currentQuestionIndex === 0 ? '0' : '1';
            prevButton.style.pointerEvents = currentQuestionIndex === 0 ? 'none' : 'auto';
        }

        function selectAnswer(profile) {
            scores[profile]++;
            answerHistory.push(profile);
            currentQuestionIndex++;

            if (currentQuestionIndex < questions.length) {
                showQuestion();
            } else {
                showResult();
            }
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                const lastProfile = answerHistory.pop();
                scores[lastProfile]--;
                showQuestion();
            }
        }

        function showResult() {
            showScreen('result-view');

            // Calcula vencedor
            let max = -1;
            let winner = 'inspiracao';
            for (let p in scores) {
                if (scores[p] > max) {
                    max = scores[p];
                    winner = p;
                }
            }

            const data = resultsData[winner];
            document.getElementById('result-title').innerText = data.title;
            const focusEl = document.getElementById('result-focus');
            focusEl.innerText = data.focus;

            // Reseta cores e aplica a do vencedor
            focusEl.className = `font-title text-xl font-semibold ${data.colorClass}`;

            document.getElementById('result-description').innerText = data.description;
        }

        // --- 5. Eventos ---
        document.getElementById('start-btn').addEventListener('click', startQuiz);
        document.getElementById('restart-button').addEventListener('click', () => showScreen('start-view'));
        prevButton.addEventListener('click', prevQuestion);

        // Inicializa na tela de Início
        showScreen('start-view');

    </script>
</body>

</html>
